services:
    test-db:
        image: postgres:16
        container_name: ascenda-test-postgres
        environment:
            POSTGRES_USER: devuser
            POSTGRES_PASSWORD: devpass
            POSTGRES_DB: ascenda_test
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U devuser -d ascenda_test"]
            interval: 2s
            timeout: 3s
            retries: 15           